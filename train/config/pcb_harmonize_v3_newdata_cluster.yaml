flux_path: "/projects/_ssd/xrssd/DiffSynth-Studio/models/black-forest-labs/FLUX.1-dev"
dtype: "bfloat16"

model:
  independent_condition: false

train:
  accumulate_grad_batches: 2
  batch_size: 2
  dataloader_workers: 4
  save_interval: 1000
  sample_interval: 1000
  max_steps: 8000
  gradient_checkpointing: true
  save_path: "/projects/_ssd/xrssd/OminiControl/runs"
  gradient_clip_val: 0.5

  condition_type: "pcb_harmonize"

  dataset:
    anno_dir: "/projects/_ssd/xrssd/data/ti_pcb/layout_data/v2_Color_Res_Class_xywh/annotation/train"
    image_dir: "/projects/_ssd/xrssd/data/ti_pcb/layout_data/v2_Color_Res_Class_xywh/image/train"

    condition_size:
      - 512
      - 512
    target_size:
      - 512
      - 512

    crops_per_board: 10
    resize_jitter: 0.15
    min_visible_ratio: 0.5
    min_components: 2
    edge_margin: 5

    drop_text_prob: 0.1
    drop_image_prob: 0.1

    zoom_prob: 0.4
    zoom_crop_size: 256

    component_loss_weight: 3.0

  lora_config:
    r: 16
    lora_alpha: 16
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  optimizer:
    type: "Prodigy"
    params:
      lr: 1
      use_bias_correction: true
      safeguard_warmup: true
      weight_decay: 0.01

  wandb:
    project: "OminiControl-PCB"
